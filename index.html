<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
        />
        <title>UGM Timer</title>
        <link rel="stylesheet" href="css/app.css" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" href="icons/icon-512.png" />
        <link rel="apple-touch-icon" href="icons/icon-512.png" />
        <meta name="theme-color" content="#101418" />
        <script
            src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
            integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR"
            crossorigin="anonymous"
            defer
        ></script>
    </head>
    <body>
        <div id="app">
            <button type="button" id="btn-settings" aria-label="Settings">
                ⚙
            </button>

            <div id="pairing-bar">
                <span id="pairing-status">offline</span>
                <span id="pairing-code" hidden></span>
                <button
                    type="button"
                    id="btn-copy-code"
                    aria-label="Copy code"
                    hidden
                >
                    📋
                </button>
                <button type="button" id="btn-connect-admin">
                    Connect as admin
                </button>
                <button type="button" id="btn-compose-message" hidden>
                    Message
                </button>
            </div>

            <header id="controls-bar">
                <div id="primary-controls">
                    <button type="button" id="btn-toggle">Start</button>
                    <button type="button" id="btn-reset">Reset</button>
                    <button type="button" id="btn-fullscreen">⛶</button>
                </div>
                <div id="quick-adjust" hidden>
                    <button type="button" class="adjust-btn" data-delta="-60">
                        −1:00
                    </button>
                    <button type="button" class="adjust-btn" data-delta="-30">
                        −0:30
                    </button>
                    <button type="button" class="adjust-btn" data-delta="30">
                        +0:30
                    </button>
                    <button type="button" class="adjust-btn" data-delta="60">
                        +1:00
                    </button>
                </div>
            </header>

            <div id="message-band" aria-live="polite">
                <div id="message-text"></div>
                <button type="button" id="btn-dismiss-message" hidden>
                    Dismiss
                </button>
            </div>

            <main id="timer-zone">
                <div
                    id="timer-display"
                    tabindex="0"
                    role="button"
                    aria-label="Edit duration"
                >
                    00:00
                </div>

                <div id="duration-editor" hidden>
                    <label>
                        Min
                        <input
                            type="number"
                            id="duration-minutes"
                            min="0"
                            max="180"
                            value="20"
                            inputmode="numeric"
                        />
                    </label>
                    <label>
                        Sec
                        <input
                            type="number"
                            id="duration-seconds"
                            min="0"
                            max="59"
                            value="0"
                            inputmode="numeric"
                        />
                    </label>
                    <button type="button" id="duration-apply">Set</button>
                    <button type="button" id="duration-cancel">Cancel</button>
                    <div id="duration-presets">
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="5"
                        >
                            5m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="10"
                        >
                            10m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="15"
                        >
                            15m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="20"
                        >
                            20m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="30"
                        >
                            30m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="45"
                        >
                            45m
                        </button>
                    </div>
                </div>
            </main>

            <dialog id="settings-dialog">
                <form method="dialog" id="settings-form">
                    <h2>Settings</h2>

                    <fieldset>
                        <legend>Base background color</legend>
                        <input
                            type="color"
                            id="setting-base-color"
                            value="#101418"
                        />
                    </fieldset>

                    <fieldset id="threshold-rows">
                        <legend>Color thresholds (up to 3)</legend>
                        <!-- rows injected by main.js -->
                    </fieldset>

                    <div id="settings-actions">
                        <button type="button" id="btn-install" hidden>
                            Install app
                        </button>
                        <button type="button" id="settings-reset-defaults">
                            Reset to defaults
                        </button>
                        <button type="submit" id="settings-save">Save</button>
                        <button type="button" id="settings-close">
                            Cancel
                        </button>
                    </div>
                </form>
            </dialog>

            <dialog id="connect-dialog">
                <form method="dialog" id="connect-form">
                    <h2>Connect as admin</h2>
                    <label>
                        Presenter code
                        <input
                            type="text"
                            id="connect-code"
                            placeholder="ugm-xxxxxx"
                            autocapitalize="none"
                            autocomplete="off"
                        />
                    </label>
                    <div id="connect-actions">
                        <button type="submit" id="connect-submit">
                            Connect
                        </button>
                        <button type="button" id="connect-cancel">
                            Cancel
                        </button>
                    </div>
                    <p id="connect-error" role="alert"></p>
                </form>
            </dialog>

            <dialog id="message-dialog">
                <form method="dialog" id="message-form">
                    <h2>Send message</h2>
                    <textarea
                        id="message-input"
                        rows="2"
                        maxlength="120"
                        placeholder="Up to ~10 words"
                    ></textarea>
                    <div id="message-font-controls">
                        <span>Size</span>
                        <button type="button" id="message-font-minus">
                            A−
                        </button>
                        <button type="button" id="message-font-plus">A+</button>
                    </div>

                    <div id="message-preview-label">
                        Live preview (shown in the band above):
                    </div>

                    <div id="message-actions">
                        <button type="button" id="message-dismiss-btn">
                            Dismiss
                        </button>
                        <button type="submit" id="message-send">Send</button>
                        <button type="button" id="message-close">Close</button>
                    </div>
                </form>
            </dialog>
        </div>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
