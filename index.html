<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
        />
        <title>UGM Timer</title>
        <link rel="stylesheet" href="css/app.css" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" href="icons/icon-512.png" />
        <link rel="apple-touch-icon" href="icons/icon-512.png" />
        <meta name="theme-color" content="#101418" />
        <script
            src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
            integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR"
            crossorigin="anonymous"
            defer
        ></script>
    </head>
    <body>
        <div id="app">
            <header id="topbar">
                <!-- 1. Pairing -->
                <section class="topbar-section" id="section-pairing">
                    <span id="pairing-status">offline</span>
                    <span id="pairing-code" hidden></span>
                    <button
                        type="button"
                        id="btn-copy-code"
                        class="icon-btn"
                        aria-label="Copy code"
                        title="Copy code"
                        hidden
                    >
                        ⧉
                    </button>
                    <button type="button" id="btn-connect-admin">
                        Connect as admin
                    </button>
                    <button type="button" id="btn-compose-message" hidden>
                        Message
                    </button>
                </section>

                <!-- 2. Transport -->
                <section class="topbar-section" id="section-transport">
                    <button
                        type="button"
                        id="btn-toggle"
                        class="primary"
                        aria-label="Start or pause"
                    >
                        <span id="btn-toggle-icon" aria-hidden="true">▶</span>
                        <span id="btn-toggle-label">Start</span>
                    </button>
                    <button type="button" id="btn-reset" aria-label="Reset">
                        <span aria-hidden="true">↺</span>
                        <span>Reset</span>
                    </button>
                </section>

                <!-- 3. Quick adjust -->
                <section class="topbar-section" id="section-adjust">
                    <button type="button" class="adjust-btn" data-delta="60">
                        +1:00
                    </button>
                    <button type="button" class="adjust-btn" data-delta="30">
                        +0:30
                    </button>
                    <button type="button" class="adjust-btn" data-delta="-30">
                        −0:30
                    </button>
                    <button type="button" class="adjust-btn" data-delta="-60">
                        −1:00
                    </button>
                </section>

                <!-- 4. View -->
                <section class="topbar-section" id="section-view">
                    <button
                        type="button"
                        id="btn-fullscreen"
                        class="icon-btn"
                        aria-label="Toggle fullscreen"
                        title="Fullscreen"
                    >
                        ⛶
                    </button>
                    <button
                        type="button"
                        id="btn-settings"
                        class="icon-btn"
                        aria-label="Settings"
                        title="Settings"
                    >
                        ⚙
                    </button>
                </section>
            </header>

            <div id="message-band" aria-live="polite">
                <div id="message-text"></div>
            </div>

            <main id="timer-zone">
                <div
                    id="timer-display"
                    tabindex="0"
                    role="button"
                    aria-label="Set duration"
                >
                    00:00
                </div>
            </main>

            <dialog id="duration-dialog">
                <form method="dialog" id="duration-form">
                    <h2>Set duration</h2>
                    <div id="duration-fields">
                        <label>
                            Minutes
                            <input
                                type="number"
                                id="duration-minutes"
                                min="0"
                                max="180"
                                value="20"
                                inputmode="numeric"
                            />
                        </label>
                        <label>
                            Seconds
                            <input
                                type="number"
                                id="duration-seconds"
                                min="0"
                                max="59"
                                value="0"
                                inputmode="numeric"
                            />
                        </label>
                    </div>
                    <div id="duration-presets">
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="5"
                        >
                            5m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="10"
                        >
                            10m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="15"
                        >
                            15m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="20"
                        >
                            20m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="30"
                        >
                            30m
                        </button>
                        <button
                            type="button"
                            class="preset-btn"
                            data-minutes="45"
                        >
                            45m
                        </button>
                    </div>
                    <div class="dialog-actions">
                        <button type="submit" id="duration-apply">Set</button>
                        <button type="button" id="duration-cancel">
                            Cancel
                        </button>
                    </div>
                </form>
            </dialog>

            <dialog id="settings-dialog">
                <form method="dialog" id="settings-form">
                    <h2>Settings</h2>

                    <fieldset id="threshold-rows">
                        <legend>Color thresholds (up to 3)</legend>
                        <!-- rows injected by main.js -->
                    </fieldset>

                    <fieldset id="pairing-settings">
                        <legend>Pairing</legend>
                        <div id="pairing-settings-info"></div>
                        <button type="button" id="btn-disconnect">
                            Disconnect / reset pairing
                        </button>
                    </fieldset>

                    <div class="dialog-actions">
                        <button type="button" id="btn-install" hidden>
                            Install app
                        </button>
                        <button type="button" id="settings-reset-defaults">
                            Reset to defaults
                        </button>
                        <button type="submit" id="settings-save">Save</button>
                        <button type="button" id="settings-close">
                            Cancel
                        </button>
                    </div>
                </form>
            </dialog>

            <dialog id="connect-dialog">
                <form method="dialog" id="connect-form">
                    <h2>Connect as admin</h2>
                    <label>
                        Presenter code
                        <input
                            type="text"
                            id="connect-code"
                            placeholder="ugm-xxxxxx"
                            autocapitalize="none"
                            autocomplete="off"
                        />
                    </label>
                    <div class="dialog-actions">
                        <button type="submit" id="connect-submit">
                            Connect
                        </button>
                        <button type="button" id="connect-cancel">
                            Cancel
                        </button>
                    </div>
                    <p id="connect-error" role="alert"></p>
                </form>
            </dialog>

            <dialog id="message-dialog">
                <form method="dialog" id="message-form">
                    <h2>Send message</h2>
                    <div
                        id="message-input"
                        contenteditable="true"
                        role="textbox"
                        aria-multiline="true"
                        aria-label="Message text"
                        data-placeholder="Up to ~10 words"
                    ></div>
                    <div id="message-font-controls">
                        <span>Size</span>
                        <button type="button" id="message-font-minus">
                            A−
                        </button>
                        <span id="message-font-value">5</span>
                        <button type="button" id="message-font-plus">A+</button>
                    </div>

                    <div id="message-preview-label">
                        Text above is shown at the real size used on screen.
                    </div>

                    <div class="dialog-actions">
                        <button type="button" id="message-dismiss-btn">
                            Dismiss
                        </button>
                        <button type="submit" id="message-send">Send</button>
                        <button type="button" id="message-close">Close</button>
                    </div>
                </form>
            </dialog>
        </div>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
